<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin: Printing and Stationery Department - Government of Meghalaya</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/admin_template.css">
    <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/admin_creator_list.css">

    <!-- <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> -->
    <link rel="stylesheet" href="/css/sweetalert2.min.css">
    <script src="/js/sweetalert2.all.min.js"></script>
 <style>
    .form-upload {
        max-width: 600px;
        margin: auto;
    }

    .form-upload .form-group {
        margin-bottom: 1.5rem;
    }

    .form-upload label {
        font-weight: 600;
        font-size: 15px;
        color: #343a40;
    }

    .form-upload input[type="file"],
    .form-upload input[type="text"] {
        border: 1px solid #ced4da;
        border-radius: 6px;
        width: 100%;
        padding: 10px 12px;
        background-color: #fff;
        font-size: 14px;
    }

    .form-upload input[type="text"] {
        height: 42px;
    }

    .form-upload button[type="submit"] {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border-radius: 6px;
        background-color: #007bff;
        border: none;
        transition: background-color 0.3s;
    }

    .form-upload button[type="submit"]:hover {
        background-color: #0056b3;
    }

    .form-upload i {
        margin-right: 6px;
    }
</style>



    

</head>
<body>


<div th:replace="~{admin/admin_template :: navbar}"></div>



<div class="wrapper">

    <div th:replace="~{admin/admin_template :: sidebar}"></div>
    
    <main class="content" id="content">


        <div class="dashboard-container">
            <h2 class="dashboard-title">Photo Gallery</h2>

            
<div class="container mt-5 mb-5">
    <h3 class="mb-4">📷 Manage Gallery</h3>

    <!-- Upload Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form class="form-upload">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div class="form-group">
        <label for="galleryImages">Upload Image <span class="text-danger">*</span></label>
        <input type="file" class="form-control-file" id="galleryImages" name="galleryImages" accept="image/*" required>
    </div>
    <div class="form-group">
        <label for="imageDescription">Image Description <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="imageDescription" name="imageDescription" placeholder="Enter image description..." required>
    </div>
    <button type="submit" class="btn btn-primary">
        <i class="fas fa-upload"></i> Upload
    </button>
</form>

        </div>
    </div>

    <!-- Gallery Grid -->
    <div class="row">
    <!-- Loop through images -->
    <div class="col-md-4 mb-4" th:each="img : ${images}">
        <div class="card-gallery">
            <img th:src="@{'/gallery/images/' + ${img.imageTitle}}" alt="Gallery Image" style="width: 100%; height: 200px; object-fit: cover;">
            <div class="card-footer">
                <!-- <button class="btn btn-info btn-action"><i class="fas fa-eye"></i> View</button> -->
                 <a th:href="@{/gallery/images/{file}(file=${img.imageTitle})}" class="btn btn-info btn-action" target="_blank">
                    <i class="fas fa-eye"></i> View
                </a>
                <!-- <button class="btn btn-danger btn-action"><i class="fas fa-trash-alt"></i> Delete</button> -->
                 <button class="btn btn-danger btn-action" th:onclick="'deleteImage(' + ${img.imageId} + ')'">
                     <i class="fas fa-trash-alt"></i> Delete
                </button>

            </div>
        </div>
    </div>
</div>

</div>

        </div>
    </div>

</div>
        </div>

</main>
</div>

<div th:replace="~{admin/admin_template :: footer}"></div>
<div th:replace="~{admin/admin_template :: editModal}"></div>
<div th:replace="~{admin/admin_template :: saveEditModal}"></div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="/js/admin_gallery.js"></script>
<script src="/js/extra.js"></script>

</body>
</html>
