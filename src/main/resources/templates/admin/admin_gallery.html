<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin: Printing and Stationery Department - Government of Meghalaya</title>
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin_template.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin_creator_list.css}">
    <link rel="stylesheet" th:href="@{/css/admin_gallery.css}">


    <link rel="stylesheet" th:href="@{/css/sweetalert2.min.css}">
    <script th:src="@{/js/sweetalert2.all.min.js}"></script>




    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

</head>

<body>


    <div th:replace="~{admin/admin_template :: navbar}"></div>



    <div class="wrapper">

        <div th:replace="~{admin/admin_template :: sidebar}"></div>

        <main class="content" id="content">


            <div class="dashboard-container">
                <h2 class="dashboard-title">Photo Gallery</h2>


                <div class="container mt-5 mb-5">
                    <h3 class="mb-4">📷 Manage Gallery</h3>

                    <!-- Upload Form -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-body">
                            <form class="form-upload">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <div class="form-group">
                                    <label for="galleryImages">Upload Image <span class="text-danger">*</span></label>
                                    <input type="file" class="form-control-file" id="galleryImages" name="galleryImages"
                                        accept="image/*" required>
                                </div>
                                <div class="form-group">
                                    <label for="imageDescription">Image Description <span
                                            class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="imageDescription"
                                        name="imageDescription" placeholder="Enter image description..." required>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-upload"></i> Upload
                                </button>
                            </form>

                        </div>
                    </div>

                    <!-- Gallery Grid -->
                    <div class="row">
                        <!-- Loop through images -->
                        <div class="col-md-4 mb-4" th:each="img : ${images}">
                            <div class="card-gallery">
                                <img th:src="@{'/gallery/images/' + ${img.imageId}}" alt="Gallery Image"
                                    id="img-gallery">
                                <div class="card-footer">
                                    <!-- <button class="btn btn-info btn-action"><i class="fas fa-eye"></i> View</button> -->
                                    <a th:href="@{/gallery/images/{file}(file=${img.imageId})}"
                                        class="btn btn-info btn-action" target="_blank" rel="noopener noreferrer">
                                        <i class="fas fa-eye"></i> View
                                    </a>
                                    <!-- <button class="btn btn-danger btn-action"><i class="fas fa-trash-alt"></i> Delete</button> -->
                                    <!-- <button class="btn btn-danger btn-action"
                                        th:onclick="'deleteImage(' + ${img.imageId} + ')'">
                                        <i class="fas fa-trash-alt"></i> Delete
                                    </button> -->
                                    <button class="btn btn-danger btn-action delete-btn"
                                        th:attr="data-id=${img.imageId}">
                                        <i class="fas fa-trash-alt"></i> Delete
                                    </button>

                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
    </div>

    </div>
    </div>

    </main>
    </div>

    <div th:replace="~{admin/admin_template :: footer}"></div>
    <div th:replace="~{admin/admin_template :: editModal}"></div>
    <div th:replace="~{admin/admin_template :: saveEditModal}"></div>

    <!-- Scripts -->
    <script th:src="@{/js/jquery-4.0.0.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/admin_gallery.js}"></script>
    <script th:src="@{/js/extra.js}"></script>

</body>

</html>
