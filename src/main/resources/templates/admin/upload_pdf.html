<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin: Printing and Stationery Department - Government of Meghalaya</title>
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin_template.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin_creator_list.css}">
    <link rel="stylesheet" th:href="@{/css/upload_pdf.css}">


    <!-- <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> -->
    <link rel="stylesheet" th:href="@{/css/sweetalert2.min.css}">
    <script th:src="@{/js/sweetalert2.all.min.js}"></script>




</head>

<body>


    <div th:replace="~{admin/admin_template :: navbar}"></div>



    <div class="wrapper">

        <div th:replace="~{admin/admin_template :: sidebar}"></div>

        <main class="content" id="content">


            <div class="dashboard-container">
                <h2 class="dashboard-title mb-4">Pdf Dashboard</h2>

                <div class="tender-upload-form card p-4 rounded shadow-sm">
                    <form id="pdfForm" th:action="@{/admin/uploadPdf}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <div class="form-group mb-3">
                            <label for="title" class="form-label fw-bold">Pdf Title</label>
                            <input type="text" class="form-control input-style" id="title" name="title"
                                placeholder="Enter tender title" required>
                        </div>

                        <div class="form-group mb-4">
                            <label for="pdfFile" class="form-label fw-bold">Upload PDF</label>
                            <input type="file" class="form-control-file input-style" id="pdfFile" name="pdfFile"
                                accept="application/pdf" required>
                        </div>

                        <button id="saveButton" type="button" class="btn btn-primary upload-btn">Upload Pdf</button>
                    </form>
                </div>
            </div>




        </main>
    </div>

    </div>

    <div th:replace="~{admin/admin_template :: footer}"></div>


    <div th:replace="~{admin/admin_template :: editModal}"></div>
    <div th:replace="~{admin/admin_template :: saveEditModal}"></div>

    <!-- Scripts -->
    <script th:src="@{/js/jquery-3.5.1.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/extra.js}"></script>
    <script th:src="@{/js/upload_pdf.js}"></script>

</body>

</html>
