<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>
    Login: Printing and Stationery Department - Government of Meghalaya
  </title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" th:href="@{/css/login.css}" />

  <!-- <script src="https://kit.fontawesome.com/3d8df9be04.js" crossorigin="anonymous"></script> -->
  <link rel="stylesheet" th:href="@{/css/all.min.css}" />


  <script th:src="@{/js/jquery.min.js}"></script>
  <script th:src="@{/js/jquery.creaseFont.min.js}"></script>
</head>

<body>
  <!-- Banner -->
  <header class="header">
    <img class="banner-image" th:src="@{/images/navbar.jpg}" alt="Banner" />
  </header>

  <!-- Main Login Section -->
  <main class="main-content">
    <!-- Error message for failed login -->
    <div id="errorMessage" th:if="${error}" class="error" th:text="${error}"></div>

    <!-- Session timeout message -->
    <div id="sessionExpiredMessage" th:if="${param.session == 'expired'}" class="error">
      <strong>Session Expired:</strong> Your session has timed out due to
      inactivity. Please login again.
    </div>

    <!-- Logout success message -->
    <div id="logoutMessage" th:if="${param.logout == 'true'}" class="success">
      <strong>Logged out successfully</strong>
    </div>

    <div class="login-container">
      <h2 class="login-title">Login</h2>
      <form th:action="@{/login}" method="post" class="login-form" id="loginform" autocomplete="off">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="input-group">
          <i class="fa-regular fa-circle-user"></i>
          <input type="text" name="username" placeholder="Username" required class="form-input" autocomplete="off" />
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" name="password" placeholder="Password" required class="form-input"
            autocomplete="off" />
        </div>


        <div class="captcha-container">
          <img id="captchaImage" th:src="@{/captcha-image}" alt="CAPTCHA" class="captcha-image">
          <button type="button" id="refreshCaptchaBtn" class="refresh-button" title="Refresh CAPTCHA">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
        </div>

        <div class="input-group">
          <i class="fa-solid fa-shield-halved"></i>
          <input type="text" name="captcha" id="captchaInput" placeholder="Enter CAPTCHA" class="form-input" required
            autocomplete="off">
        </div>


        <button type="submit" class="submit-button">Login</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <div class="footer">
    Site designed, developed and hosted by National Informatics Centre
  </div>
  <script th:src="@{/js/login.js}"></script>
</body>

</html>
