<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login: Printing and Stationery Department - Government of Meghalaya</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
                Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            width: 100%;
        }

        .banner-image {
            width: 100%;
            height: auto;
            max-height: 170px;
            object-fit: cover;
            display: block;
        }

        .main-content {
            flex-grow: 1;
            padding: 2rem 1rem;
        }

        .login-container {
            max-width: 28rem;
            margin: 0 auto;
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }

        .form-input {
            width: 100%;
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .captcha-container {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .refresh-button {
            padding: 0.5rem;
            border: none;
            background: none;
            cursor: pointer;
            border-radius: 9999px;
            transition: background-color 0.2s;
        }

        .refresh-button:hover {
            background-color: #f3f4f6;
        }

        .submit-button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-button:hover {
            background-color: #1d4ed8;
        }

        .error {
            transition: opacity 1s ease;
            color: red;
            text-align: center;
            margin-bottom: 1rem;
        }

        .hidden {
            opacity: 0;
        }

        .footer {
            margin-top: auto;
            background-color: #677fa3;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: #003367;
        }
    </style>
    <script src="https://kit.fontawesome.com/3d8df9be04.js" crossorigin="anonymous"></script>
</head>
<body>

<!-- Banner -->
<header class="header">
    <img class="banner-image" src="/images/navbar.jpg" alt="Banner">
</header>



<!-- Main Login Section -->
<main class="main-content">
    <!-- Error message for failed login -->
    <div id="errorMessage" th:if="${error}" class="error" th:text="${error}"></div>
    
    <!-- Session timeout message -->
    <div id="sessionExpiredMessage" th:if="${param.session == 'expired'}" class="error" style="background-color: #ff9800; border-color: #ff9800;">
        <strong>Session Expired:</strong> Your session has timed out due to inactivity. Please login again.
    </div>
    
    <!-- Logout success message -->
    <div id="logoutMessage" th:if="${param.logout == 'true'}" class="success" style="background-color: #4CAF50; border-color: #4CAF50; color: white;">
        <strong>Logged out successfully</strong>
    </div>

    <div class="login-container">
        <h2 class="login-title">Login</h2>
        <form th:action="@{/login}" method="post" class="login-form" id="loginform">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="input-group">
                <i class="fa-regular fa-circle-user"></i>
                <input type="text" name="username" placeholder="Username" required class="form-input" />
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required class="form-input" />
            </div>

            <div class="captcha-container">
                <canvas id="captchaCanvas" width="150" height="50" title="Click to refresh CAPTCHA" onclick="generateCaptcha()"></canvas>
                <button type="button" onclick="generateCaptcha()" class="refresh-button" title="Refresh CAPTCHA">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-shield-halved"></i>
                <input type="text" name="captcha" placeholder="Enter CAPTCHA" class="form-input" id="captchaInput" required />
            </div>

            <button type="submit" class="submit-button">Login</button>
        </form>
    </div>
</main>

<!-- Footer -->
<div class="footer">
    Site designed, developed and hosted by National Informatics Centre
</div>

<script>
    // Generate canvas CAPTCHA
    function generateCaptcha() {
        const canvas = document.getElementById("captchaCanvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f0f0f0";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw random lines
        for (let i = 0; i < 5; i++) {
            ctx.strokeStyle = `rgba(${Math.floor(Math.random() * 255)}, ${Math.floor(
                Math.random() * 255
            )}, ${Math.floor(Math.random() * 255)}, 0.7)`;
            ctx.beginPath();
            ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.stroke();
        }

        // Generate CAPTCHA text
        const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        let captcha = "";
        for (let i = 0; i < 6; i++) {
            captcha += characters.charAt(Math.floor(Math.random() * characters.length));
        }

        ctx.font = "24px Arial";
        ctx.fillStyle = "#000";
        ctx.textBaseline = "middle";
        ctx.fillText(captcha, 40, canvas.height / 2);
        canvas.setAttribute("data-captcha", captcha);
    }

    // Validate CAPTCHA before submission
    document.getElementById("loginform").addEventListener("submit", function (event) {
        const userCaptcha = document.getElementById("captchaInput").value.trim();
        const generatedCaptcha = document.getElementById("captchaCanvas").getAttribute("data-captcha");
        const errorDiv = document.getElementById("errorMessage");

        // Clear previous errors
        errorDiv.textContent = "";

        if (userCaptcha !== generatedCaptcha) {
            errorDiv.textContent = "CAPTCHA does not match. Please try again.";
            errorDiv.style.opacity = "1";
            generateCaptcha();
            event.preventDefault(); // prevent form submission
        }
    });

    // Generate CAPTCHA on page load
    window.onload = generateCaptcha;
</script>

</body>
</html>
