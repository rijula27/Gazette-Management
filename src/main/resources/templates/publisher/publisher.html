<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>
      Publisher: Printing and Stationery Department - Government of Meghalaya
      Dashboard
    </title>

    <link rel="stylesheet" th:href="@{/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/publisher_template.css}" />
    <link rel="stylesheet" th:href="@{/css/sweetalert2.min.css}" />
    <link rel="stylesheet" th:href="@{/css/publisher.css}" />

    <script th:src="@{/js/sweetalert2.all.min.js}"></script>
  </head>

  <body>
    <div th:replace="~{publisher/publisher_template :: navbar}"></div>
    <div class="wrapper">
      <div th:replace="~{publisher/publisher_template :: sidebar}"></div>

      <main class="content" id="content">
        <div class="container">
          <h2 class="text-center mb-4">Gazette Dashboard</h2>

          <!-- Search Bar -->
          <div
            class="search-container text-center mb-3"
            th:if="${#lists.size(gazettes) > 0}"
          >
            <input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="Search by Title Date or Part"
            />
          </div>
          <div class="total-count text-center mb-3">
            <p>
              Total Tenders: <span th:text="${#lists.size(gazettes)}">0</span>
            </p>
          </div>
          <table
            class="table table-bordered table-striped align-middle"
            th:if="${#lists.size(gazettes) > 0}"
          >
            <thead class="thead-dark">
              <tr>
                <th>Sl No</th>
                <th>Title</th>
                <th>Date</th>
                <th>Part</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="gazetteTableBody">
              <!-- Iterate over gazettes and display each in a row -->
              <tr th:each="gazette, iterStat : ${gazettes}">
                <td th:text="${iterStat.index + 1}">1</td>
                <td
                  th:text="(${gazette.date} + '-' + ${gazette.part} + '.pdf' )"
                >
                  Title
                </td>
                <td th:text="${gazette.date}">Date</td>
                <td th:text="${gazette.part}">Part</td>
                <td>
                  <div class="btn-group">
                    <a
                      class="dropdown-item"
                      th:href="@{/gazette/pdf/{id}(id=${gazette.id})}"
                      target="_blank" rel="noopener noreferrer"
                      >👁️ View</a
                    >

                    <button
                      type="button"
                      class="btn btn-secondary btn-sm dropdown-toggle"
                      data-bs-toggle="dropdown"
                      aria-expanded="false"
                    >
                      More
                    </button>
                    <ul class="dropdown-menu">
                      <li>
                        <a
                          href="#"
                          class="dropdown-item edit-btn"
                          th:attr="data-id=${gazette.id}, data-part=${gazette.part}"
                        >
                          ✏️ Edit
                        </a>
                      </li>

                      <li>
                        <a
                          href="#"
                          class="dropdown-item delete-btn"
                          th:attr="data-id=${gazette.id}"
                        >
                          🗑️ Delete
                        </a>
                      </li>

                      <li>
                        <a
                          href="#"
                          class="dropdown-item sendback-btn"
                          th:attr="data-id=${gazette.id}"
                        >
                          📥 Send Back
                        </a>
                      </li>

                      <li>
                        <a
                          href="#"
                          class="dropdown-item publish-btn"
                          th:attr="data-id=${gazette.id}"
                        >
                          📁 Published
                        </a>
                      </li>
                    </ul>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
          <p th:unless="${#lists.size(gazettes) > 0}" class="no-data-message">
            No gazette entries available.
          </p>
          <div id="paginationControls"></div>
        </div>

        <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
      </main>
    </div>

    <div th:replace="~{publisher/publisher_template :: footer}"></div>

    <!-- Edit Modal -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      role="dialog"
      aria-labelledby="editModalLabel"
      aria-hidden="true"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
    >
      <div class="modal-dialog" role="document">
        <form id="editForm">
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="editModalLabel">Edit Gazette</h5>
              <button
                type="button"
                class="close"
                data-bs-dismiss="modal"
                aria-label="Close"
                id="edb"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <!-- Hidden field for Gazette ID -->
              <input type="hidden" name="gazetteId" id="gazetteId" />

              <!-- Field for Part -->
              <div class="input-group">
                <!-- Custom Date Input -->
                <input
                  type="date"
                  class="form-control custom-date"
                  id="date"
                  name="date"
                  required
                />
              </div>

              <div class="form-group">
                <label for="editPart">Part</label>
                <select class="form-control" id="editPart" name="part" required>
                  <option value="I">I</option>
                  <option value="IIA">IIA</option>
                  <option value="IIB">IIB</option>
                  <option value="III">III</option>
                  <option value="IV">IV</option>
                  <option value="V">V</option>
                  <option value="VI">VI</option>
                  <option value="VII">VII</option>
                  <option value="VIII">VIII</option>
                  <option value="IX">IX</option>
                  <option value="X">X</option>
                </select>
              </div>

              <!-- Field for PDF upload -->
              <div class="form-group">
                <label for="editPdfFile">Upload PDF</label>
                <input
                  type="file"
                  class="form-control-file"
                  id="editPdfFile"
                  name="pdfFile"
                  accept="application/pdf"
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button
                type="button"
                class="btn btn-primary"
                id="confirmUpdateBtn"
              >
                Proceed to Update
              </button>
            </div>
          </div>
        </form>
        <script></script>
      </div>
    </div>

    <!-- Scripts -->

    <script th:src="@{/js/jquery-3.5.1.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/publisher.js}"></script>
    <script th:src="@{/js/extra.js}"></script>
  </body>
</html>
