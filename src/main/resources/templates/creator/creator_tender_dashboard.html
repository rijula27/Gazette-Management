<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Creator: Printing and Stationery Department - Government of Meghalaya Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/creator_template.css}">
    <link rel="stylesheet" th:href="@{/css/sweetalert2.min.css}">
    <link rel="stylesheet" th:href="@{/css/creatorTenderDashboard.css}">
    
    <script th:src="@{/js/sweetalert2.all.min.js}"></script>

    

</head>

<body>

    <div th:replace="~{creator/creator_template :: navbar}"></div>

    <div class="wrapper">

        <!-- Card Content -->
        <div th:replace="~{creator/creator_template :: sidebar}"></div>

        <main class="content" id="content">


            <div class="dashboard-container">
                <h2 class="dashboard-title">Tender Dashboard</h2>





                <!-- Search Bar -->
                <div class="search-container text-center mb-3" th:if="${#lists.size(tenders) > 0}">
                    <input type="text" id="searchInput" class="form-control"
                        placeholder="Search by Title Reference no or Openning Date">
                </div>

                <div class="total-count text-center mb-3">
                    <p>Total Tenders: <span th:text="${#lists.size(tenders)}">0</span></p>
                </div>
                <div class="table-wrapper">
                    <table class="dashboard-table" th:if="${#lists.size(tenders) > 0}">
                        <table class="dashboard-table" th:if="${#lists.size(tenders) > 0}">
                            <thead>
                                <tr>
                                    <th class="fixed-action-column-small">Sl No</th>
                                    <th>Title</th>
                                    <th>Reference No</th>
                                    <th>Announcement Date</th>
                                    <th>Last Date</th>
                                    <th>Openning Date</th>
                                    <th>Keywords</th>
                                    <th class="fixed-action-column">Actions</th>

                                </tr>
                            </thead>
                            <tbody id="gazetteTableBody">
                                <tr th:each="tender, iterStat : ${tenders}">
                                    <td th:text="${iterStat.index + 1}" class="fixed-action-column-small">1</td>
                                    <td th:text="${tender.title}">gazette-title.pdf</td>
                                    <td th:text="${tender.ref_No}">gazette-title.pdf</td>
                                    <td th:text="${tender.announcement_Date}">Part 1</td>
                                    <td th:text="${tender.last_Date}">2025-03-11</td>
                                    <td th:text="${tender.opening_Date}">2025-03-11</td>
                                    <td th:text="${tender.keywords}">Part 1</td>

                                    <!-- <td class="fixed-action-column">
                                        <div class="dropdown">
                                            <a th:href="@{/tender/pdf/{id}(id=${tender.tId})}" target="_blank">👁️&nbsp;
                                                &nbsp; &nbsp;</a>

                                            <button class="dropdown-toggle" onclick="toggleDropdown(this)">More
                                            </button>
                                            <div class="dropdown-menu">
                                                <a href="#" th:attr="data-id=${tender.tId}, data-title=${tender.title}"
                                                    onclick="openEditModal(this)">✏️ Edit</a>
                                                <a href="#" th:attr="data-id=${tender.tId}"
                                                    onclick="confirmDelete(this)">🗑️ Delete</a>
                                                <a href="#" th:attr="data-id=${tender.tId}"
                                                    onclick="sendPublisher(this)">📤 Send</a>
                                            </div>
                                        </div>
                                    </td> -->
                                    <td class="fixed-action-column">
                                        <div class="dropdown">
                                            <a th:href="@{/tender/pdf/{id}(id=${tender.tId})}" target="_blank" rel="noopener noreferrer">👁️&nbsp;&nbsp;&nbsp;</a>

                                            <button type="button" class="dropdown-toggle">More</button>

                                            <div class="dropdown-menu">
                                                <a href="#" class="edit-btn"
                                                th:attr="data-id=${tender.tId}, data-title=${tender.title}">
                                                ✏️ Edit
                                                </a>

                                                <a href="#" class="delete-btn"
                                                th:attr="data-id=${tender.tId}">
                                                🗑️ Delete
                                                </a>

                                                <a href="#" class="send-btn"
                                                th:attr="data-id=${tender.tId}">
                                                📤 Send
                                                </a>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr id="noResultsRow" style="display: none;">
                                    <td colspan="8" class="text-center text-muted">No results found</td>
                                </tr>
                            </tbody>
                        </table>
                        <p th:unless="${#lists.size(tenders) > 0}" class="no-data-message">No gazette entries available.
                        </p>
                </div>

                <div id="paginationControls"></div>

            </div>


        </main>
    </div>

    <div th:replace="~{creator/creator_template :: footer}"></div>


    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel"
        aria-hidden="true" data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog" role="document">
            <form id="editForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editModalLabel">Edit Gazette</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <!-- Hidden field for Gazette ID -->
                        <input type="hidden" name="tenderId" id="tenderId">

                        <!-- <input type="date" name="announcement_Date" id="announcement_Date" style="display: none;"> -->
                        <input type="hidden" name="title" id="title">


                        <label for="last_Date">Last Date</label>
                        <div class="input-group">
                            <!-- Custom Date Input -->
                            <input type="date" class="form-control custom-date" id="last_Date" name="last_Date"
                                required>

                        </div>

                        <!-- Field for Part -->
                        <label for="opening_Date">Openning Date</label>
                        <div class="input-group">
                            <!-- Custom Date Input -->
                            <input type="date" class="form-control custom-date" id="opening_Date" name="opening_Date"
                                required>

                        </div>






                        <!-- Field for PDF upload -->
                        <div class="form-group">
                            <label for="editPdfFile">Upload PDF</label>
                            <input type="file" class="form-control-file" id="editPdfFile" name="pdfFile"
                                accept="application/pdf">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">
                            Cancel
                        </button>

                        <button type="button" class="btn btn-primary" id="confirmUpdateBtn">
                            Proceed to Update
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/jquery-3.5.1.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/creator_tender_dashboard.js}"></script>
    <script th:src="@{/js/extra.js}"></script>


</body>

</html>
