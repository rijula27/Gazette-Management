<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Creator: Printing and Stationery Department - Government of Meghalaya Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/creator_template.css}">
    <link rel="stylesheet" th:href="@{/css/sweetalert2.min.css}">
    <link rel="stylesheet" th:href="@{/css/creatorDashboard.css}">

    <script th:src="@{/js/sweetalert2.all.min.js}"></script>
    

</head>

<body>

    <div th:replace="~{creator/creator_template :: navbar}"></div>

    <div class="wrapper">

        <!-- Card Content -->
        <div th:replace="~{creator/creator_template :: sidebar}"></div>

        <main class="content" id="content">


            <div class="dashboard-container">
                <h2 class="dashboard-title">Gazette Dashboard</h2>





                <!-- Search Bar -->
                <div class="search-container text-center mb-3" th:if="${#lists.size(gazettes) > 0}">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search by Title Date or Part">
                </div>
                <div class="total-count text-center mb-3">
                    <p>Total Tenders: <span th:text="${#lists.size(gazettes)}">0</span></p>
                </div>

                <div class="table-wrapper">
                    <table class="dashboard-table" th:if="${#lists.size(gazettes) > 0}">
                        <!-- <div class="table-wrapper"> -->
                        <table class="dashboard-table" th:if="${#lists.size(gazettes) > 0}">
                            <thead>
                                <tr>
                                    <th>Sl No</th>
                                    <th>Title</th>
                                    <th>Date</th>
                                    <th>Part</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="gazetteTableBody">
                                <tr th:each="gazette, iterStat : ${gazettes}">
                                    <td th:text="${iterStat.index + 1}">1</td>
                                    <td th:text="(${gazette.date} + '-' + ${gazette.part} + '.pdf' )">gazette-title.pdf
                                    </td>
                                    <td th:text="${gazette.date}">2025-03-11</td>
                                    <td th:text="${gazette.part}">Part 1</td>
                                    <td>
                                        <div class="dropdown">
                                            <a th:href="@{/gazette/pdf/{id}(id=${gazette.id})}" target="_blank" rel="noopener noreferrer"
                                                class="no-underline">👁️&nbsp; &nbsp; &nbsp;</a>

                                            <button class="dropdown-toggle">More
                                            </button>
                                            <div class="dropdown-menu">
                                                <a href="#" class="edit-btn" th:attr="data-id=${gazette.id}, data-part=${gazette.part}">✏️ Edit</a>
                                                <a href="#" class="delete-btn" th:attr="data-id=${gazette.id}">🗑️ Delete</a>
                                                <a href="#" class="send-btn" th:attr="data-id=${gazette.id}">📤 Send</a>
                                                <!-- <a th:href="@{/gazette/pdf/{id}(id=${gazette.id})}" target="_blank">👁️ View</a> -->
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr id="noResultsRow" style="display: none;">
                                    <td colspan="5" class="text-center text-muted">No results found</td>
                                </tr>
                            </tbody>
                        </table>
                        <p th:unless="${#lists.size(gazettes) > 0}" class="no-data-message">No gazette entries
                            available.</p>


                        <div id="paginationControls"></div>

                </div>


        </main>
    </div>

    <div th:replace="~{creator/creator_template :: footer}"></div>


    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel"
        aria-hidden="true" data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog" role="document">
            <form id="editForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editModalLabel">Edit Gazette</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <!-- Hidden field for Gazette ID -->
                        <input type="hidden" name="gazetteId" id="gazetteId">

                        <!-- Field for Part -->
                        <label for="date">Date</label>

                        <div class="input-group">
                            <!-- Custom Date Input -->
                            <input type="date" class="form-control custom-date" id="date" name="date" required>

                        </div>


                        <div class="form-group">
                            <label for="editPart">Part</label>
                            <select class="form-control" id="editPart" name="part" required>
                                <option value="I">I</option>
                                <option value="IIA">IIA</option>
                                <option value="IIB">IIB</option>
                                <option value="III">III</option>
                                <option value="IV">IV</option>
                                <option value="V">V</option>
                                <option value="VI">VI</option>
                                <option value="VII">VII</option>
                                <option value="VIII">VIII</option>
                                <option value="IX">IX</option>
                                <option value="X">X</option>
                            </select>
                        </div>

                        <!-- Field for PDF upload -->
                        <div class="form-group">
                            <label for="editPdfFile">Upload PDF</label>
                            <input type="file" class="form-control-file" id="editPdfFile" name="pdfFile"
                                accept="application/pdf">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" id="confirmEditBtn">Proceed to Update</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <!-- <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script> -->

    <script th:src="@{/js/jquery-3.5.1.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/extra.js}"></script>
    <script th:src="@{/js/creator_dashboard.js}"></script>


</body>

</html>
