<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Creator: Printing and Stationery Department - Government of Meghalaya Dashboard</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" th:href="@{/css/all.min.css}">

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

    <!-- Custom Styles -->
    <link rel="stylesheet" th:href="@{/css/creator_template.css}">
    <link rel="stylesheet" th:href="@{/css/creator_tender.css}">
    <link rel="stylesheet" th:href="@{/css/sweetalert2.min.css}">

    <!-- SweetAlert -->
    <script th:src="@{/js/sweetalert2.all.min.js}"></script>
</head>

<body>

    <!-- Navbar -->
    <div th:replace="~{creator/creator_template :: navbar}"></div>

    <div class="wrapper d-flex">
        <!-- Sidebar -->
        <div th:replace="~{creator/creator_template :: sidebar}"></div>

        <!-- Main Content -->
        <main class="content p-4" id="content">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-10">
                        <div class="card">
                            <div class="card-header">
                                <i class="fa fa-upload me-2"></i> Upload Tender Details
                            </div>
                            <div class="card-body p-4">
                                <form th:action="@{/tender/uploadTender}" method="post" enctype="multipart/form-data"
                                    id="tender_form">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <div class="row">
                                        <div class="col-md-6 mb-4 icon-input">
                                            <label class="form-label">Tender Title <span
                                                    class="text-danger">*</span></label>
                                            <i class="fa fa-file-alt"></i>
                                            <input type="text" id="title" name="title" class="form-control"
                                                placeholder="Enter tender title" required>
                                        </div>
                                        <div class="col-md-6 mb-4 icon-input">
                                            <label class="form-label">Reference Number <span
                                                    class="text-danger">*</span></label>
                                            <i class="fa fa-hashtag"></i>
                                            <input type="text" id="ref_No" name="ref_No" class="form-control"
                                                placeholder="Enter reference number" required>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-4 mb-4">
                                            <label class="form-label">Announcement Date <span
                                                    class="text-danger">*</span></label>
                                            <input type="date" id="announcement_Date" name="announcement_Date"
                                                class="form-control" required>
                                        </div>
                                        <div class="col-md-4 mb-4">
                                            <label class="form-label">Last Date for Submission <span
                                                    class="text-danger">*</span></label>
                                            <input type="date" id="last_Date" name="last_Date" class="form-control"
                                                required>
                                        </div>
                                        <div class="col-md-4 mb-4">
                                            <label class="form-label">Opening Date <span
                                                    class="text-danger">*</span></label>
                                            <input type="date" id="opening_Date" name="opening_Date"
                                                class="form-control" required>
                                        </div>
                                    </div>

                                    <div class="row align-items-center mb-4">
                                        <div class="col-md-6">
                                            <label class="form-label">Upload PDF <span
                                                    class="text-danger">*</span></label>
                                            <div class="d-flex align-items-center">
                                                <span id="fileLabel" class="file-label-display">No file selected</span>
                                                <button type="button" class="custom-file-btn"
                                                    id="selectFileBtn">Browse</button>
                                                <input type="file" id="pdfFile" name="pdfFile" accept="application/pdf"
                                                    class="custom-file-input" required>
                                            </div>
                                        </div>

                                        <div class="col-md-6 icon-input">
                                            <label class="form-label">Keywords</label>
                                            <i class="fa fa-tags"></i>
                                            <input type="text" id="keywords" name="keywords" class="form-control"
                                                placeholder="Enter keywords (comma-separated)">
                                        </div>
                                    </div>

                                    <div class="text-center">
                                        <button type="button" class="btn btn-primary" id="saveTender">Submit</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>


    <div th:replace="~{creator/creator_template :: footer}"></div>


    <script th:src="@{/js/creator_tender.js}"></script>
    <script th:src="@{/js/extra.js}"></script>


</body>

</html>
