# Session timeout configuration (in minutes) - 30 minutes
server.servlet.session.timeout=30m
# HttpSession security attributes - prevents session hijacking
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=JSESSIONID
# server.servlet.session.cookie.secure=false    
server.servlet.session.cookie.secure=true    
# ⚠️ Change to true on production HTTPS
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
# spring.jpa.show-sql=true
spring.jpa.show-sql=false
# ✅ ADD THIS — cookie expires with session
server.servlet.session.cookie.max-age=-1


server.port=8089


#server.servlet.context-path=/megpns


server.error.whitelabel.enabled=false



# Thymeleaf Cache (disable caching during development)
# spring.thymeleaf.cache=false
spring.thymeleaf.cache=true


# logging.level.org.springframework.security=DEBUG

logging.level.org.springframework.security=INFO






# Set max file size to 5MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB



# server.error.include-stacktrace=never
# server.error.include-exception=false
# server.error.include-message=never
# server.error.include-binding-errors=never

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.server-header=


server.error.path=/error



# ✅ ADD THESE TWO LINES
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false



# Development values → Production values
# server.servlet.session.cookie.secure=false  → true
# spring.jpa.show-sql=true                   → false
# spring.thymeleaf.cache=false               → true
# logging.level.org.springframework.security=DEBUG → INFO